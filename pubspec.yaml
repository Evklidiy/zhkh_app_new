name: zhkh_app_new
description: "Мобильный медицинский дневник со сканером бланков лабораторных анализов"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  flutter_bloc: ^9.1.1
  equatable: ^2.0.7

  # Charts
  fl_chart: ^0.69.0

  # SQLite
  sqflite: ^2.4.1
  path: ^1.9.0

  # Hive
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Camera + OCR (стабильные версии)
  camera: ^0.10.6
  google_mlkit_text_recognition: ^0.14.0

  path_provider: ^2.1.5
  intl: ^0.19.0
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true